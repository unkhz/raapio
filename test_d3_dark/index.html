<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raapio - Module Dependency Graph (D3.js)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: white;
            --border-color: #e2e8f0;
            --header-bg: white;
            --header-shadow: rgba(0, 0, 0, 0.1);
            --controls-bg: rgba(255, 255, 255, 0.95);
            --controls-border: #e2e8f0;
            --btn-bg: #f1f5f9;
            --btn-border: #cbd5e1;
            --btn-hover: #e2e8f0;
            --btn-active: #cbd5e1;
            --btn-text: #475569;
            --stats-color: #64748b;
            --legend-bg: rgba(255, 255, 255, 0.95);
            --info-bg: rgba(255, 255, 255, 0.95);
            --info-title: #374151;
            --info-text: #6b7280;
            --shadow: rgba(0, 0, 0, 0.1);
            --node-stroke: #94a3b8;
            --node-text: #1e293b;
            --link-stroke: #94a3b8;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --card-bg: #1e293b;
            --border-color: #334155;
            --header-bg: #1e293b;
            --header-shadow: rgba(0, 0, 0, 0.3);
            --controls-bg: rgba(30, 41, 59, 0.95);
            --controls-border: #334155;
            --btn-bg: #334155;
            --btn-border: #475569;
            --btn-hover: #475569;
            --btn-active: #64748b;
            --btn-text: #e2e8f0;
            --stats-color: #94a3b8;
            --legend-bg: rgba(30, 41, 59, 0.95);
            --info-bg: rgba(30, 41, 59, 0.95);
            --info-title: #e2e8f0;
            --info-text: #94a3b8;
            --shadow: rgba(0, 0, 0, 0.3);
            --node-stroke: #64748b;
            --node-text: #e2e8f0;
            --link-stroke: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            height: 100vh;
            overflow: hidden;
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        #header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            box-shadow: 0 1px 3px var(--header-shadow);
            z-index: 1000;
            position: relative;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            transition: color 0.3s ease;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            color: var(--btn-text);
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: var(--btn-hover);
        }
        
        .btn:active {
            background: var(--btn-active);
        }

        #dark-mode-toggle {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            color: var(--btn-text);
            margin-left: 12px;
            transition: all 0.3s ease;
        }
        
        .stats {
            font-size: 12px;
            color: var(--stats-color);
            margin-left: 12px;
            transition: color 0.3s ease;
        }
        
        #visualization {
            width: 100%;
            height: calc(100vh - 60px);
            background-color: var(--card-bg);
            cursor: grab;
            transition: background-color 0.3s ease;
        }
        
        #visualization:active {
            cursor: grabbing;
        }
        
        .legend {
            position: absolute;
            top: 80px;
            right: 20px;
            background: var(--legend-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px var(--shadow);
            font-size: 12px;
            max-width: 200px;
            z-index: 100;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        
        .legend-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--info-title);
            transition: color 0.3s ease;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #d1d5db;
        }
        
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            font-size: 12px;
            max-width: 400px;
            display: none;
            z-index: 100;
        }
        
        .info-title {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        
        .info-detail {
            color: #6b7280;
            margin-bottom: 4px;
        }
        
        .connections {
            margin-top: 12px;
        }
        
        .connection-section {
            margin-bottom: 8px;
        }
        
        .connection-label {
            font-weight: 500;
            color: #374151;
            margin-bottom: 4px;
        }
        
        .connection-list {
            color: #6b7280;
            line-height: 1.4;
            max-height: 80px;
            overflow-y: auto;
        }
        
        /* D3 specific styles */
        .node {
            cursor: pointer;
            stroke-width: 2;
        }
        
        .node:hover {
            stroke-width: 3;
            filter: brightness(1.1);
        }
        
        .node.selected {
            stroke: #dc2626;
            stroke-width: 3;
        }
        
        .link {
            fill: none;
            stroke: #94a3b8;
            stroke-width: 1.5;
            marker-end: url(#arrowhead);
        }
        
        .link.highlighted {
            stroke: #3b82f6;
            stroke-width: 2.5;
        }
        
        .node-label {
            fill: #1e293b;
            font-size: 11px;
            font-weight: 500;
            text-anchor: middle;
            pointer-events: none;
            user-select: none;
        }
        
        /* Custom scrollbar */
        .connection-list::-webkit-scrollbar {
            width: 4px;
        }
        
        .connection-list::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        
        .connection-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="header">
        <div class="header-content">
            <div class="title">Module Dependency Graph</div>
            <div class="controls">
                <button class="btn" onclick="fitToScreen()">Fit All</button>
                <button class="btn" onclick="zoomIn()">Zoom In</button>
                <button class="btn" onclick="zoomOut()">Zoom Out</button>
                <button class="btn" onclick="resetView()">Reset</button>
                <button class="btn" onclick="toggleLayout()">Switch Layout</button>
                <button id="dark-mode-toggle" onclick="toggleDarkMode()">🌙 Dark Mode</button>
                <div class="stats">
                    <span id="nodeCount">0</span> nodes, <span id="linkCount">0</span> dependencies
                </div>
            </div>
        </div>
    </div>
    
    <svg id="visualization"></svg>
    
    <div class="legend">
        <div class="legend-title">File Types</div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #3b82f6;"></div>
            <span>TypeScript</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #f59e0b;"></div>
            <span>JavaScript</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #8b5cf6;"></div>
            <span>Stylesheets</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #10b981;"></div>
            <span>HTML</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #f97316;"></div>
            <span>Config</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #ef4444;"></div>
            <span>Modules</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: #6b7280;"></div>
            <span>Documentation</span>
        </div>
    </div>
    
    <div class="info-panel" id="infoPanel">
        <div class="info-title" id="infoTitle">Module Details</div>
        <div class="info-detail" id="infoPath"></div>
        <div class="connections">
            <div class="connection-section">
                <div class="connection-label">Dependencies:</div>
                <div class="connection-list" id="dependencies">None</div>
            </div>
            <div class="connection-section">
                <div class="connection-label">Dependents:</div>
                <div class="connection-list" id="dependents">None</div>
            </div>
        </div>
    </div>

    <script>
        let graphData = null;
        let svg = null;
        let g = null;
        let simulation = null;
        let nodes = null;
        let links = null;
        let nodeElements = null;
        let linkElements = null;
        let labelElements = null;
        let selectedNode = null;
        let currentLayout = 'force';
        let isDarkMode = localStorage.getItem('darkMode') === 'true';

        // Dark mode functionality
        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            const toggle = document.getElementById('dark-mode-toggle');
            
            if (isDarkMode) {
                document.body.setAttribute('data-theme', 'dark');
                toggle.textContent = '☀️ Light Mode';
                localStorage.setItem('darkMode', 'true');
            } else {
                document.body.removeAttribute('data-theme');
                toggle.textContent = '🌙 Dark Mode';
                localStorage.setItem('darkMode', 'false');
            }
            
            // Update D3 elements with new theme
            updateTheme();
        }

        function updateTheme() {
            const rootStyle = getComputedStyle(document.documentElement);
            const linkColor = rootStyle.getPropertyValue('--link-stroke').trim();
            const nodeStroke = rootStyle.getPropertyValue('--node-stroke').trim();
            const nodeText = rootStyle.getPropertyValue('--node-text').trim();
            
            // Update link colors
            if (linkElements) {
                linkElements.style('stroke', linkColor);
            }
            
            // Update node stroke colors
            if (nodeElements) {
                nodeElements.style('stroke', nodeStroke);
            }
            
            // Update text colors
            if (labelElements) {
                labelElements.style('fill', nodeText);
            }
            
            // Update arrow marker
            d3.select('#arrowhead path').attr('fill', linkColor);
        }

        // Zoom behavior
        const zoom = d3.zoom()
            .scaleExtent([0.1, 3])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        // Initialize visualization
        function initVisualization() {
            const container = d3.select("#visualization");
            const width = window.innerWidth;
            const height = window.innerHeight - 60;

            svg = container
                .attr("width", width)
                .attr("height", height)
                .call(zoom);

            // Add arrow marker
            svg.append("defs")
                .append("marker")
                .attr("id", "arrowhead")
                .attr("viewBox", "0 -5 10 10")
                .attr("refX", 15)
                .attr("refY", 0)
                .attr("markerWidth", 6)
                .attr("markerHeight", 6)
                .attr("orient", "auto")
                .append("path")
                .attr("d", "M0,-5L10,0L0,5")
                .attr("fill", "#94a3b8");

            g = svg.append("g");

            // Hide info panel when clicking outside nodes
            svg.on("click", () => {
                if (nodeElements) nodeElements.classed("selected", false);
                if (linkElements) linkElements.classed("highlighted", false);
                selectedNode = null;
                document.getElementById('infoPanel').style.display = 'none';
            });

            // Handle window resize
            window.addEventListener('resize', () => {
                const newWidth = window.innerWidth;
                const newHeight = window.innerHeight - 60;
                svg.attr("width", newWidth).attr("height", newHeight);
                if (simulation) {
                    simulation.force("center", d3.forceCenter(newWidth / 2, newHeight / 2));
                    simulation.alpha(0.3).restart();
                }
            });
        }

        function createForceLayout() {
            if (!nodes || !links) return;
            
            const width = window.innerWidth;
            const height = window.innerHeight - 60;

            if (simulation) {
                simulation.stop();
            }

            simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(100))
                .force("charge", d3.forceManyBody().strength(-300))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collision", d3.forceCollide().radius(30));

            simulation.on("tick", ticked);
        }

        function createHierarchicalLayout() {
            // Simple hierarchical layout using dagre-like positioning
            const width = window.innerWidth;
            const height = window.innerHeight - 60;

            // Create a simple layered layout
            const layers = new Map();
            const visited = new Set();
            const rootNodes = nodes.filter(node => 
                !links.some(link => link.target.id === node.id)
            );

            // Assign layers using BFS
            function assignLayers(startNodes, layer) {
                const nextLayer = [];
                startNodes.forEach(node => {
                    if (!visited.has(node.id)) {
                        visited.add(node.id);
                        if (!layers.has(layer)) layers.set(layer, []);
                        layers.get(layer).push(node);
                        
                        const children = links
                            .filter(link => link.source.id === node.id)
                            .map(link => link.target);
                        nextLayer.push(...children);
                    }
                });
                
                if (nextLayer.length > 0) {
                    assignLayers(nextLayer, layer + 1);
                }
            }

            assignLayers(rootNodes.length > 0 ? rootNodes : [nodes[0]], 0);

            // Position nodes in layers
            const layerWidth = width / (layers.size || 1);
            const layerHeight = height;

            layers.forEach((layerNodes, layerIndex) => {
                const nodeHeight = layerHeight / (layerNodes.length + 1);
                layerNodes.forEach((node, nodeIndex) => {
                    node.fx = layerWidth * (layerIndex + 0.5);
                    node.fy = nodeHeight * (nodeIndex + 1);
                });
            });

            if (simulation) {
                simulation.alpha(1).restart();
            }
        }

        function renderGraph() {
            // Clear existing elements
            g.selectAll("*").remove();

            // Create links
            linkElements = g.append("g")
                .selectAll("line")
                .data(links)
                .enter()
                .append("line")
                .attr("class", "link");

            // Create nodes
            nodeElements = g.append("g")
                .selectAll("circle")
                .data(nodes)
                .enter()
                .append("circle")
                .attr("class", "node")
                .attr("r", d => d.size)
                .attr("fill", d => d.color)
                .attr("stroke", d => d3.color(d.color).darker(0.5))
                .on("click", onNodeClick)
                .on("mouseover", onNodeHover)
                .on("mouseout", onNodeLeave)
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended));

            // Create labels
            labelElements = g.append("g")
                .selectAll("text")
                .data(nodes)
                .enter()
                .append("text")
                .attr("class", "node-label")
                .attr("dy", d => d.size + 15)
                .text(d => d.name);

            if (currentLayout === 'force') {
                createForceLayout();
            } else {
                createHierarchicalLayout();
            }
        }

        function ticked() {
            linkElements
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            nodeElements
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);

            labelElements
                .attr("x", d => d.x)
                .attr("y", d => d.y);
        }

        // Event handlers
        function onNodeClick(event, d) {
            event.stopPropagation();
            
            // Clear previous selection
            nodeElements.classed("selected", false);
            linkElements.classed("highlighted", false);
            
            selectedNode = d;
            d3.select(event.target).classed("selected", true);
            
            // Highlight connected links
            linkElements.classed("highlighted", link => 
                link.source.id === d.id || link.target.id === d.id
            );
            
            showNodeInfo(d);
        }

        function onNodeHover(event, d) {
            showNodeInfo(d);
        }

        function onNodeLeave(event, d) {
            // Keep info panel visible
        }

        function showNodeInfo(nodeData) {
            if (!nodeData || !graphData) return;

            const panel = document.getElementById('infoPanel');
            document.getElementById('infoTitle').textContent = nodeData.name;
            document.getElementById('infoPath').textContent = nodeData.fullPath;

            // Find dependencies and dependents
            const dependencies = graphData.links
                .filter(link => link.source === nodeData.id || (link.source.id && link.source.id === nodeData.id))
                .map(link => {
                    const targetId = link.target.id || link.target;
                    const targetNode = graphData.nodes.find(n => n.id === targetId);
                    return targetNode ? targetNode.name : 'Unknown';
                });

            const dependents = graphData.links
                .filter(link => link.target === nodeData.id || (link.target.id && link.target.id === nodeData.id))
                .map(link => {
                    const sourceId = link.source.id || link.source;
                    const sourceNode = graphData.nodes.find(n => n.id === sourceId);
                    return sourceNode ? sourceNode.name : 'Unknown';
                });

            document.getElementById('dependencies').innerHTML = 
                dependencies.length > 0 ? dependencies.join('<br>') : '<em>None</em>';
            document.getElementById('dependents').innerHTML = 
                dependents.length > 0 ? dependents.join('<br>') : '<em>None</em>';

            panel.style.display = 'block';
        }

        // Drag handlers
        function dragstarted(event, d) {
            if (!event.active && simulation) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active && simulation) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        // Control functions
        function fitToScreen() {
            if (!g || !nodes || nodes.length === 0) return;
            
            try {
                const bounds = g.node().getBBox();
                const fullWidth = +svg.attr("width");
                const fullHeight = +svg.attr("height");
                const width = bounds.width;
                const height = bounds.height;
                const midX = bounds.x + width / 2;
                const midY = bounds.y + height / 2;
                
                if (width === 0 || height === 0) return;
                
                const scale = Math.min(0.8, 0.8 / Math.max(width / fullWidth, height / fullHeight));
                const translate = [fullWidth / 2 - scale * midX, fullHeight / 2 - scale * midY];

                svg.transition()
                    .duration(750)
                    .call(zoom.transform, d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale));
            } catch (error) {
                console.warn('Could not fit to screen:', error);
                // Fallback: just reset to center
                resetView();
            }
        }

        function zoomIn() {
            svg.transition().duration(300).call(zoom.scaleBy, 1.2);
        }

        function zoomOut() {
            svg.transition().duration(300).call(zoom.scaleBy, 0.8);
        }

        function resetView() {
            svg.transition()
                .duration(750)
                .call(zoom.transform, d3.zoomIdentity);
        }

        function toggleLayout() {
            currentLayout = currentLayout === 'force' ? 'hierarchical' : 'force';
            
            if (currentLayout === 'force') {
                // Remove fixed positions
                nodes.forEach(node => {
                    node.fx = null;
                    node.fy = null;
                });
                createForceLayout();
            } else {
                createHierarchicalLayout();
            }
        }

        // Initialize dark mode
        if (isDarkMode) {
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('dark-mode-toggle').textContent = '☀️ Light Mode';
        }

        // Initialize and load data
        initVisualization();

        fetch('graph-data.json')
            .then(response => response.json())
            .then(data => {
                graphData = data;
                nodes = data.nodes.map(d => Object.assign({}, d));
                links = data.links.map(d => Object.assign({}, d));
                
                // Update stats
                document.getElementById('nodeCount').textContent = nodes.length;
                document.getElementById('linkCount').textContent = links.length;
                
                renderGraph();
                
                // Auto-fit after the simulation has settled
                setTimeout(() => {
                    if (simulation) {
                        simulation.on("end", () => {
                            setTimeout(fitToScreen, 500);
                        });
                    } else {
                        setTimeout(fitToScreen, 500);
                    }
                }, 1000);
            })
            .catch(error => {
                console.error('Error loading graph data:', error);
            });
    </script>
</body>
</html>
